name: macOS

on: [ push, pull_request ]

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.10.2"
  QT_ARCH: "clang_64"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          version: ${{env.QT_VERSION}}
          arch: ${{env.QT_ARCH}}

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -D CMAKE_BUILD_TYPE=$BUILD_TYPE -D USE_TESTS=ON -D USE_LTO=ON -D CMAKE_OSX_DEPLOYMENT_TARGET="12" -D CMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        working-directory: ${{runner.workspace}}/build
        run: cmake --build . --config $BUILD_TYPE

      - name: Test
        run: ${{runner.workspace}}/build/lib/test/spotify-qt-lib-test

      - name: Package
        run: macdeployqt ${{runner.workspace}}/build/spotify-qt.app -dmg -verbose=2

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: spotify-qt
          archive: false
          path: ${{runner.workspace}}/build/spotify-qt.dmg

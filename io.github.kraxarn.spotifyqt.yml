id: io.github.kraxarn.spotifyqt
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: spotify-qt
finish-args:
  - "--share=network"
  - "--socket=fallback-x11"
  - "--socket=wayland"
  - "--share=ipc"
  - "--own-name=org.mpris.MediaPlayer2.spotify-qt"
  - "--talk-name=org.freedesktop.Notifications"
  - "--device=dri"
  - "--talk-name=org.kde.StatusNotifierWatcher"
  - "--filesystem=~/.cargo/bin/librespot:ro"

modules:
  - name: spotify-qt
    buildsystem: cmake
    sources:
      - type: git
        url: https://github.com/kraxarn/spotify-qt.git
        branch: stable
